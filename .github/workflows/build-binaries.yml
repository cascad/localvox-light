# Сборка release-бинарников + опционально GitHub Release с вложениями.
# Триггеры: PR, push рабочих веток (по paths), tag v* и ручной запуск.

name: Build binaries

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "После сборки опубликовать GitHub Release с бинарниками"
        type: boolean
        default: false
      release_tag:
        description: "Имя тега, например v0.1.0 (нужно, если publish_release)"
        type: string
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".env.defaults"
      - "crates/**"
      - "src-tauri/**"
      - "ui/**"
      - ".github/workflows/build-binaries.yml"
      - "scripts/setup-vosk.sh"
      - "scripts/setup-vosk.ps1"
      - "scripts/install-release.sh"
      - "scripts/install-release.ps1"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/setup-tools.sh"
      - "scripts/setup-tools.ps1"
      - "scripts/tests/test_bootstrap_delivery.py"
      - "scripts/test-installer.ps1"
      - "scripts/test-installer.sh"
      - "scripts/setup-mpv.mjs"
      - "scripts/setup-ollama.ps1"
      - "scripts/setup-ollama.sh"
      - "scripts/fetch-models.ps1"
      - "scripts/fetch-models.sh"
      - "scripts/model-paths.ps1"
      - "scripts/model-paths.sh"
      - "scripts/tests/test_model_storage_delivery.py"
      - "scripts/models.json"
      - "scripts/package-release.py"
      - "scripts/build-onnxruntime-macos.py"
      - "scripts/tests/test_native_delivery.py"
      - "scripts/check-release-install.py"
      - "scripts/tests/test_ci_delivery.py"
      - "scripts/tests/test_release_delivery.py"
      - "docs/release-installation.md"
      - "docs/terminal-workspace.md"

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            # ort's CPU static distribution uses glibc __isoc23_* symbols.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: localvox-x86_64-unknown-linux-gnu
            vosk_preset: linux-x86_64
            desktop: false

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: localvox-aarch64-unknown-linux-gnu
            vosk_preset: linux-aarch64
            desktop: false

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: localvox-x86_64-pc-windows-msvc
            vosk_preset: ""
            desktop: true

          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: localvox-x86_64-apple-darwin
            vosk_preset: darwin
            desktop: true

          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: localvox-aarch64-apple-darwin
            vosk_preset: darwin
            desktop: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ORT 1.24.2 no longer publishes an Intel Mac SDK. Build the same version
      # from the pinned upstream commit; cache only the verified finished SDK.
      - name: Restore Intel Mac ONNX Runtime SDK
        if: matrix.target == 'x86_64-apple-darwin'
        id: ort-cache
        uses: actions/cache/restore@v5
        with:
          path: target/native/onnxruntime-intel
          key: ort-1.24.2-cpu-macos15-intel-${{ hashFiles('scripts/build-onnxruntime-macos.py') }}

      - name: Prepare Intel Mac CPU ONNX Runtime
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-onnxruntime-macos.py --output target/native/onnxruntime-intel --jobs 2
          echo "ORT_LIB_PATH=$PWD/target/native/onnxruntime-intel" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      - name: Cache the completed Intel Mac SDK before the application build
        if: matrix.target == 'x86_64-apple-darwin' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/native/onnxruntime-intel
          key: ${{ steps.ort-cache.outputs.cache-primary-key }}

      - name: Install Linux build deps (ALSA / cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config patchelf jq unzip zsh fish

      - name: Ensure macOS installer JSON tool
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v jq >/dev/null; then brew install jq; fi
          if ! command -v fish >/dev/null; then brew install fish; fi

      - name: Install Vosk native library (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/setup-vosk.sh
          ./scripts/setup-vosk.sh --preset=${{ matrix.vosk_preset }}

      - name: Install Vosk native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-vosk.ps1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Интерфейс ВШИВАЕТСЯ в бинарь на этапе компиляции (rust-embed из ui/dist). Без этого
      # шага build.rs подкладывает заглушку «Интерфейс не собран» — и ровно она уезжала в
      # релиз: демон поднимался, а страница сообщала, что фронта нет.
      - name: Build the web interface
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Fail if the interface did not build
        shell: bash
        run: |
          set -euo pipefail
          test -s ui/dist/index.html
          if grep -q "Интерфейс не собран" ui/dist/index.html; then
            echo "ui/dist contains the placeholder" >&2
            exit 1
          fi
          test -n "$(find ui/dist/assets -name '*.js' -print -quit)"

      - name: Read pinned Rust toolchain
        id: rust-version
        shell: bash
        run: python -c 'import pathlib,tomllib; print("toolchain=" + tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          targets: ${{ matrix.target }}

      # Демон И ПОВАР. Раньше собирался только демон — установленный продукт писал звук и
      # не расшифровывал НИЧЕГО, потому что автоварке нечего было запускать.
      - name: Cargo build (демон + повар + TUI)
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p localvox-light -p localvox-light-asr -p localvox-light-terminal

      # Окно — только там, где им пользуются. На Linux оно требует webkit2gtk, чьё имя пакета
      # разъезжается между версиями Ubuntu; браузер там работает и так.
      - name: Cargo build (окно)
        if: matrix.desktop
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: cargo build --release --locked -p localvox-desktop --target ${{ matrix.target }}

      # ОДИН архив на платформу. Раздельные файлы — это приглашение установить половину:
      # именно так релиз оказался без повара.
      - name: Delivery contracts
        run: python -m unittest discover -s scripts/tests -p "test_*delivery.py" -v

      - name: Native vox registration contracts (isolated PATH/profile fixtures)
        shell: bash
        run: |
          cargo test --release --locked -p localvox-light-terminal --target ${{ matrix.target }} --lib command_path::

      - name: Installer keyboard and configuration contracts (isolated fixtures)
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: |
          export PATH="$PWD/vosk-lib:$PATH"
          export LD_LIBRARY_PATH="$PWD/vosk-lib:${ORT_LIB_PATH:-}:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$PWD/vosk-lib:${ORT_LIB_PATH:-}:${DYLD_LIBRARY_PATH:-}"
          cargo test --release --locked -p localvox-light-core --target ${{ matrix.target }} --lib env_file:: -- --test-threads=2
          cargo test --release --locked -p localvox-light --target ${{ matrix.target }} --lib --bins --test setup --test install -- --test-threads=2
          cargo test --release --locked -p localvox-setup-ui --target ${{ matrix.target }} -- --test-threads=1

      - name: Prepare verified Windows player for the offline bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-tools.ps1 -Only mpv -InstallDir "target/${{ matrix.target }}/release"

      - name: Pack and probe the complete product
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DESKTOP" = true ]; then args+=(--desktop); fi
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            args+=(--extra-native target/native/onnxruntime-intel)
          fi
          python scripts/package-release.py --target "$TARGET" \
            --source "target/$TARGET/release" --output dist "${args[@]}"

      - name: Installed bundle doctor, setup and reconciliation (no models/devices)
        run: python scripts/check-release-install.py --archive "dist/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.zip' || '.tar.gz' }}"

      - name: Installed model paths and external model reuse (no inference/downloads)
        env:
          LOCALVOX_DELIVERY_ARCHIVE: dist/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.zip' || '.tar.gz' }}
        run: python -m unittest discover -s scripts/tests -p "test_model_storage_delivery.py" -k native_resolver -v

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Собрать вложения релиза
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release-assets/ \;
          cp scripts/install.ps1 scripts/install.sh scripts/install-release.ps1 scripts/install-release.sh release-assets/
          ls -la release-assets/
          test "$(ls -1 release-assets | wc -l)" -gt 0

      - name: Set release tag name
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            [[ "$REQUESTED_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid release tag" >&2; exit 1; }
            echo "name=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          fi

      # Вместо softprops/action-gh-release (в его action.yml всё ещё node20 — снова предупреждение в логе).
      - name: Create GitHub Release (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No files in release-assets/" >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_SHA" || { echo "Tag does not match the built commit" >&2; exit 1; }
          fi
          gh release create "$TAG" "${assets[@]}" --target "$RELEASE_SHA" --title "$TAG" --generate-notes
