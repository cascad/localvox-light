# Сборка release-бинарников + опционально GitHub Release с вложениями.
# Триггеры: PR, push рабочих веток (по paths), tag v* и ручной запуск.

name: Build binaries

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "После сборки опубликовать GitHub Release с бинарниками"
        type: boolean
        default: false
      release_tag:
        description: "Имя тега, например v0.1.0 (нужно, если publish_release)"
        type: string
        required: false
        default: ""
      artifact_run_id:
        description: "Повторить только публикацию из проверенного запуска (ID; без пересборки)"
        type: string
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".env.defaults"
      - "crates/**"
      - "src-tauri/**"
      - "ui/**"
      - ".github/workflows/build-binaries.yml"
      - "scripts/setup-vosk.sh"
      - "scripts/setup-vosk.ps1"
      - "scripts/install-release.sh"
      - "scripts/install-release.ps1"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/setup-tools.sh"
      - "scripts/setup-tools.ps1"
      - "scripts/tests/test_bootstrap_delivery.py"
      - "scripts/test-installer.ps1"
      - "scripts/test-installer.sh"
      - "scripts/setup-mpv.mjs"
      - "scripts/setup-ollama.ps1"
      - "scripts/setup-ollama.sh"
      - "scripts/fetch-models.ps1"
      - "scripts/fetch-models.sh"
      - "scripts/model-paths.ps1"
      - "scripts/model-paths.sh"
      - "scripts/tests/test_model_storage_delivery.py"
      - "scripts/check-model-sources.py"
      - "scripts/tests/test_model_sources.py"
      - "scripts/models.json"
      - "scripts/package-release.py"
      - "scripts/build-onnxruntime-macos.py"
      - "scripts/tests/test_native_delivery.py"
      - "scripts/tests/test_native_probe_delivery.py"
      - "scripts/check-release-install.py"
      - "scripts/tests/test_ci_delivery.py"
      - "scripts/tests/test_release_delivery.py"
      - "scripts/publish-release.py"
      - "scripts/tests/test_publication_delivery.py"
      - "scripts/test-behavior.py"
      - "scripts/tests/test_behavior_runner.py"
      - "docs/release-installation.md"
      - "docs/terminal-workspace.md"

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

permissions:
  contents: read

jobs:
  release-preflight:
    name: Release delivery preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Publication contracts (local HTTP; no builds)
        run: python -m unittest discover -s scripts/tests -p test_publication_delivery.py -v
      - name: Local behavior runner contracts (isolated child processes)
        run: python -m unittest discover -s scripts/tests -p test_behavior_runner.py -v
      - name: Verify the tag and actual GitHub release write access before builds
        id: release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          args=(--sha "$GITHUB_SHA")
          if [ -n "$SOURCE_RUN" ]; then args=(--source-run "$SOURCE_RUN"); fi
          python scripts/publish-release.py preflight --tag "$tag" "${args[@]}"
      - name: Reject artifact reuse without publication
        if: ${{ inputs.artifact_run_id != '' && !inputs.publish_release }}
        run: exit 1

  model-sources:
    needs: release-preflight
    if: ${{ inputs.artifact_run_id == '' }}
    name: Public model download sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Source checker contracts (local HTTP)
        run: python -m unittest discover -s scripts/tests -p test_model_sources.py -v
      - name: Verify public HEAD and bounded Range downloads (no weights)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-model-sources.py

  build:
    needs: [release-preflight, model-sources]
    if: ${{ inputs.artifact_run_id == '' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            # ort's CPU static distribution uses glibc __isoc23_* symbols.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: localvox-x86_64-unknown-linux-gnu
            vosk_preset: linux-x86_64
            desktop: false

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: localvox-aarch64-unknown-linux-gnu
            vosk_preset: linux-aarch64
            desktop: false

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: localvox-x86_64-pc-windows-msvc
            vosk_preset: ""
            desktop: true

          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: localvox-x86_64-apple-darwin
            vosk_preset: darwin
            desktop: true

          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: localvox-aarch64-apple-darwin
            vosk_preset: darwin
            desktop: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ORT 1.24.2 no longer publishes an Intel Mac SDK. Build the same version
      # from the pinned upstream commit; cache only the verified finished SDK.
      - name: Restore Intel Mac ONNX Runtime SDK
        if: matrix.target == 'x86_64-apple-darwin'
        id: ort-cache
        uses: actions/cache/restore@v5
        with:
          path: target/native/onnxruntime-intel
          key: ort-1.24.2-cpu-macos15-intel-${{ hashFiles('scripts/build-onnxruntime-macos.py') }}

      - name: Prepare Intel Mac CPU ONNX Runtime
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-onnxruntime-macos.py --output target/native/onnxruntime-intel --jobs 2
          echo "ORT_LIB_PATH=$PWD/target/native/onnxruntime-intel" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      - name: Cache the completed Intel Mac SDK before the application build
        if: matrix.target == 'x86_64-apple-darwin' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/native/onnxruntime-intel
          key: ${{ steps.ort-cache.outputs.cache-primary-key }}

      - name: Install Linux build deps (ALSA / cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config patchelf jq unzip zsh fish

      - name: Ensure macOS installer JSON tool
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v jq >/dev/null; then brew install jq; fi
          if ! command -v fish >/dev/null; then brew install fish; fi

      - name: Install Vosk native library (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/setup-vosk.sh
          ./scripts/setup-vosk.sh --preset=${{ matrix.vosk_preset }}

      - name: Install Vosk native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-vosk.ps1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Интерфейс ВШИВАЕТСЯ в бинарь на этапе компиляции (rust-embed из ui/dist). Без этого
      # шага build.rs подкладывает заглушку «Интерфейс не собран» — и ровно она уезжала в
      # релиз: демон поднимался, а страница сообщала, что фронта нет.
      - name: Build the web interface
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Fail if the interface did not build
        shell: bash
        run: |
          set -euo pipefail
          test -s ui/dist/index.html
          if grep -q "Интерфейс не собран" ui/dist/index.html; then
            echo "ui/dist contains the placeholder" >&2
            exit 1
          fi
          test -n "$(find ui/dist/assets -name '*.js' -print -quit)"

      - name: Read pinned Rust toolchain
        id: rust-version
        shell: bash
        run: python -c 'import pathlib,tomllib; print("toolchain=" + tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          targets: ${{ matrix.target }}

      # Демон И ПОВАР. Раньше собирался только демон — установленный продукт писал звук и
      # не расшифровывал НИЧЕГО, потому что автоварке нечего было запускать.
      - name: Cargo build (демон + повар + TUI)
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p localvox-light -p localvox-light-asr -p localvox-light-terminal

      # Окно — только там, где им пользуются. На Linux оно требует webkit2gtk, чьё имя пакета
      # разъезжается между версиями Ubuntu; браузер там работает и так.
      - name: Cargo build (окно)
        if: matrix.desktop
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: cargo build --release --locked -p localvox-desktop --target ${{ matrix.target }}

      # ОДИН архив на платформу. Раздельные файлы — это приглашение установить половину:
      # именно так релиз оказался без повара.
      - name: Build portable terminal fixture runner
        run: cargo build --release --locked -p localvox-setup-ui --example terminal-capture --target ${{ matrix.target }}

      - name: Delivery contracts
        env:
          LOCALVOX_TEST_PTY_RUNNER: ${{ github.workspace }}/target/${{ matrix.target }}/release/examples/terminal-capture${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s scripts/tests -p "test_*delivery.py" -v

      - name: Native vox registration contracts (isolated PATH/profile fixtures)
        shell: bash
        run: |
          cargo test --release --locked -p localvox-light-terminal --target ${{ matrix.target }} --lib command_path::

      - name: macOS deletion and menu navigation terminal contracts (no audio devices)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        env:
          INSTA_UPDATE: "no"
        run: |
          cargo test --release --locked -p localvox-light-terminal --target ${{ matrix.target }} --test pty_workspace record_deletion_from_list_confirms_the_pinned_target_and_stays_responsive -- --exact
          cargo test --release --locked -p localvox-light-terminal --target ${{ matrix.target }} --test pty_workspace startup_navigation_works_before_health_during_loading_and_after_empty_or_ready_lists -- --exact

      - name: Installer keyboard and configuration contracts (isolated fixtures)
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: |
          export PATH="$PWD/vosk-lib:$PATH"
          export LD_LIBRARY_PATH="$PWD/vosk-lib:${ORT_LIB_PATH:-}:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$PWD/vosk-lib:${ORT_LIB_PATH:-}:${DYLD_LIBRARY_PATH:-}"
          cargo test --release --locked -p localvox-light-core --target ${{ matrix.target }} --lib env_file:: -- --test-threads=2
          cargo test --release --locked -p localvox-light --target ${{ matrix.target }} --lib --bins --test setup --test install -- --test-threads=2
          cargo test --release --locked -p localvox-setup-ui --target ${{ matrix.target }} -- --test-threads=1

      - name: Native archive boundaries and aliased settings HTTP fixture
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$PWD/vosk-lib:${ORT_LIB_PATH:-}:${DYLD_LIBRARY_PATH:-}"
          cargo test --release --locked -p localvox-light-api --target ${{ matrix.target }} --lib archive:: -- --test-threads=1
          cargo test --release --locked -p localvox-light-api --target ${{ matrix.target }} --lib http::tests::settings:: -- --test-threads=1

      - name: Prepare verified Windows player for the offline bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-tools.ps1 -Only mpv -InstallDir "target/${{ matrix.target }}/release"

      - name: Pack and probe the complete product
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DESKTOP: ${{ matrix.desktop }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--release-tag "$RELEASE_TAG"); fi
          if [ "$DESKTOP" = true ]; then args+=(--desktop); fi
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            args+=(--extra-native target/native/onnxruntime-intel)
          fi
          python scripts/package-release.py --target "$TARGET" \
            --source "target/$TARGET/release" --output dist "${args[@]}"

      - name: Installed bundle doctor, setup and reconciliation (no models/devices)
        run: python scripts/check-release-install.py --archive "dist/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.zip' || '.tar.gz' }}"

      - name: Installed model paths and external model reuse (no inference/downloads)
        env:
          LOCALVOX_DELIVERY_ARCHIVE: dist/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.zip' || '.tar.gz' }}
        run: python -m unittest discover -s scripts/tests -p "test_model_storage_delivery.py" -k native_resolver -v

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  interface:
    name: Release interface checks
    needs: release-preflight
    if: ${{ inputs.artifact_run_id == '' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '')) }}
    uses: ./.github/workflows/interface-tests.yml

  release:
    name: Publish GitHub Release
    needs: [release-preflight, build, interface]
    if: ${{ !cancelled() && needs.release-preflight.result == 'success' && ((needs.build.result == 'success' && needs.interface.result == 'success') || (inputs.publish_release && inputs.artifact_run_id != '' && needs.build.result == 'skipped' && needs.interface.result == 'skipped')) && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: localvox-*
          path: dist
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Собрать вложения релиза
        env:
          RELEASE_SHA: ${{ needs.release-preflight.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name 'localvox-*.zip' -o -name 'localvox-*.tar.gz' -o -name 'localvox-*.sha256' \) -exec cp {} release-assets/ \;
          for script in install.ps1 install.sh install-release.ps1 install-release.sh; do
            git show "$RELEASE_SHA:scripts/$script" > "release-assets/$script"
          done
          ls -la release-assets/
          test "$(ls -1 release-assets | wc -l)" -gt 0

      - name: Verify assets and publish the staged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.release-preflight.outputs.sha }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          args=(--sha "$RELEASE_SHA")
          if [ -n "$SOURCE_RUN" ]; then args+=(--source-run "$SOURCE_RUN"); fi
          python scripts/publish-release.py publish --tag "$TAG" --assets release-assets "${args[@]}"
