# Сборка release-бинарников + опционально GitHub Release с вложениями.
# Триггеры: PR, push рабочих веток (по paths), tag v* и ручной запуск.

name: Build binaries

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "После сборки опубликовать GitHub Release с бинарниками"
        type: boolean
        default: false
      release_tag:
        description: "Имя тега, например v0.1.0 (нужно, если publish_release)"
        type: string
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".env.defaults"
      - "crates/**"
      - "src-tauri/**"
      - "ui/**"
      - ".github/workflows/build-binaries.yml"
      - "scripts/setup-vosk.sh"
      - "scripts/setup-vosk.ps1"
      - "scripts/install-release.sh"
      - "scripts/install-release.ps1"
      - "scripts/setup-mpv.mjs"
      - "scripts/package-release.py"
      - "scripts/tests/test_release_delivery.py"
      - "docs/release-installation.md"
      - "docs/terminal-workspace.md"

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: localvox-x86_64-unknown-linux-gnu
            vosk_preset: linux-x86_64
            desktop: false

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: localvox-aarch64-unknown-linux-gnu
            vosk_preset: linux-aarch64
            desktop: false

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: localvox-x86_64-pc-windows-msvc
            vosk_preset: ""
            desktop: true

          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: localvox-x86_64-apple-darwin
            vosk_preset: darwin
            desktop: true

          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: localvox-aarch64-apple-darwin
            vosk_preset: darwin
            desktop: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build deps (ALSA / cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config patchelf

      - name: Install Vosk native library (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/setup-vosk.sh
          ./scripts/setup-vosk.sh --preset=${{ matrix.vosk_preset }}

      - name: Install Vosk native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-vosk.ps1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Интерфейс ВШИВАЕТСЯ в бинарь на этапе компиляции (rust-embed из ui/dist). Без этого
      # шага build.rs подкладывает заглушку «Интерфейс не собран» — и ровно она уезжала в
      # релиз: демон поднимался, а страница сообщала, что фронта нет.
      - name: Build the web interface
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Fail if the interface did not build
        shell: bash
        run: |
          set -euo pipefail
          test -s ui/dist/index.html
          if grep -q "Интерфейс не собран" ui/dist/index.html; then
            echo "ui/dist contains the placeholder" >&2
            exit 1
          fi
          test -n "$(find ui/dist/assets -name '*.js' -print -quit)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Демон И ПОВАР. Раньше собирался только демон — установленный продукт писал звук и
      # не расшифровывал НИЧЕГО, потому что автоварке нечего было запускать.
      - name: Cargo build (демон + повар + TUI)
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p localvox-light -p localvox-light-asr -p localvox-light-terminal

      # Окно — только там, где им пользуются. На Linux оно требует webkit2gtk, чьё имя пакета
      # разъезжается между версиями Ubuntu; браузер там работает и так.
      - name: Cargo build (окно)
        if: matrix.desktop
        shell: bash
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/vosk-lib
        run: cargo build --release --locked -p localvox-desktop --target ${{ matrix.target }}

      # ОДИН архив на платформу. Раздельные файлы — это приглашение установить половину:
      # именно так релиз оказался без повара.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Delivery contracts
        run: python -m unittest discover -s scripts/tests -p test_release_delivery.py -v

      - name: Pack and probe the complete product
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DESKTOP" = true ]; then args+=(--desktop); fi
          python scripts/package-release.py --target "$TARGET" \
            --source "target/$TARGET/release" --output dist "${args[@]}"

      - name: Install the Windows archive (no models or devices)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-release.ps1 -Archive "dist/${{ matrix.artifact }}.zip" -InstallDir "$env:RUNNER_TEMP/LocalVox install" -SkipModels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the Unix archive (no models or devices)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash scripts/install-release.sh --archive="dist/localvox-$TARGET.tar.gz" \
            --install-dir="$RUNNER_TEMP/LocalVox install" --skip-models

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Собрать вложения релиза
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          cp scripts/install-release.ps1 scripts/install-release.sh release-assets/
          ls -la release-assets/
          test "$(ls -1 release-assets | wc -l)" -gt 0

      - name: Set release tag name
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            [[ "$REQUESTED_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid release tag" >&2; exit 1; }
            echo "name=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          fi

      # Вместо softprops/action-gh-release (в его action.yml всё ещё node20 — снова предупреждение в логе).
      - name: Create GitHub Release (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No files in release-assets/" >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_SHA" || { echo "Tag does not match the built commit" >&2; exit 1; }
          fi
          gh release create "$TAG" "${assets[@]}" --target "$RELEASE_SHA" --title "$TAG" --generate-notes
