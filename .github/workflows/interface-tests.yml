name: Interface contracts and visuals

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Never create/accept visual baselines in a normal or CI test run.
      INSTA_UPDATE: "no"
      PYTHONDONTWRITEBYTECODE: "1"
      # OS fixtures spawn their own children/threads; keep runner contention bounded.
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check API Rust formatting
        run: cargo fmt -p localvox-light-api -- --check
      - name: Install native link dependency (no speech models)
        shell: pwsh
        run: ./scripts/setup-vosk.ps1
      - name: Build and test UI
        working-directory: ui
        run: |
          npm ci
          npm run build
          npm test
          npx --no-install playwright install chromium
          npm run test:e2e
          npm run setup:mpv
      - name: Rust client, styles, ConPTY and process ownership
        run: cargo test --locked -p localvox-light-client -p localvox-light-terminal -p localvox-light-process
      - name: Shared coordinator, main launcher delegation and snapshot settings
        run: |
          cargo test --locked -p localvox-light --lib
          cargo test --locked -p localvox-light --bin localvox-light
          cargo test --locked -p localvox-light --test launcher_modes -- --ignored
          cargo check --locked -p localvox-light --no-default-features
      - name: Journal, legacy progress and real HTTP
        run: |
          cargo test --locked -p localvox-light-core journal:: --lib
          cargo test --locked -p localvox-light-core progress:: --lib
          cargo test --locked -p localvox-light-core processing:: --lib
          cargo test --locked -p localvox-light-core artifacts:: --lib
          cargo test --locked -p localvox-light-api --test journal_http_contract
          cargo test --locked -p localvox-light-api journal_http_ --lib
          cargo test --locked -p localvox-light-api archive::mutations --lib
          cargo test --locked -p localvox-light-api http::tests::workspace --lib
          cargo test --locked -p localvox-light-api http::tests::settings --lib
          cargo test --locked -p localvox-light-core settings:: --lib
          cargo test --locked -p localvox-light-core presets:: --lib
          cargo test --locked -p localvox-light-core env_file:: --lib
          cargo test --locked -p localvox-light-core jobs:: --lib
          cargo test --locked -p localvox-light-core workflow:: --lib
          cargo test --locked -p localvox-light-core --features onnx cook:: --lib
          cargo test --locked -p localvox-light-core readable:: --lib
      - name: Worker profiling fixture contracts (no speech models)
        run: |
          rustfmt --edition 2021 --check crates/localvox-light-bench/src/bin/localvox-profile.rs
          rustfmt --edition 2021 --check crates/localvox-light-bench/src/bin/localvox-queue-profile.rs
          cargo test --locked -p localvox-light-bench --bin localvox-profile
          python -m unittest discover -s scripts/tests -p "test_*quality.py"
          python scripts/profile-sage-quality.py --help
          python scripts/replay-correction-retention.py --help
          rustfmt --edition 2021 --check crates/localvox-light-llm/src/correction_guard.rs crates/localvox-light-llm/src/correction_guard/russian.rs crates/localvox-light-llm/src/pipeline.rs crates/localvox-light-llm/src/bin/localvox-correction-check.rs
          cargo test --locked -p localvox-light-llm --lib
          rustfmt --edition 2021 --check crates/localvox-light-llm/src/grounding.rs crates/localvox-light-llm/src/grounding/profile.rs crates/localvox-light-bench/src/bin/localvox-grounding-profile.rs
          rustfmt --edition 2021 --check crates/localvox-light-core/src/ner.rs crates/localvox-light-core/src/ner/profile.rs crates/localvox-light-core/src/ner/windows.rs
          cargo test --locked -p localvox-light-core --features onnx ner:: --lib
          cargo test --locked -p localvox-light-bench --bin localvox-grounding-profile
          cargo test --locked -p localvox-light-bench --bin localvox-queue-profile
          cargo build --locked -p localvox-light-asr --bin localvox-process -p localvox-light-bench --bin localvox-queue-profile
          $env:LOCALVOX_PROFILE_TEST_WORKER = (Resolve-Path target/debug/localvox-process.exe).Path
          cargo test --locked -p localvox-light-bench --bin localvox-profile -- --ignored --exact text::tests::text_profile_roundtrip_uses_real_workers_and_a_numeric_only_local_llm_fixture
          cargo test --locked -p localvox-light-bench --bin localvox-profile -- --ignored --exact text::tests::text_profile_direct_endpoint_preserves_all_modes_without_trace
          cargo test --locked -p localvox-light-bench --bin localvox-profile -- --ignored --exact text::tests::sparse_real_worker_keeps_bad_edits_and_malformed_answers_as_originals
          cargo test --locked -p localvox-light-bench --bin localvox-profile -- --ignored --exact text::tests::sparse_lines_real_worker_keeps_bad_edits_and_malformed_answers_as_originals
          cargo test --locked -p localvox-light-bench --bin localvox-profile -- --ignored --exact text::tests::retention_real_worker_preserves_semantics_and_line_ownership_in_both_modes
          cargo test --locked -p localvox-light-bench --bin localvox-queue-profile -- --ignored --exact tests::real_coordinator_empty_timeout_and_preflight_failure_are_bounded
      - name: Confirmed capture input and owned codecs (no devices/models)
        run: |
          rustfmt --edition 2021 --check crates/localvox-light-core/src/chunks.rs crates/localvox-light-core/src/pipeline.rs crates/localvox-light-core/src/windowing.rs
          cargo test --locked -p localvox-light-core chunks:: --lib
          cargo test --locked -p localvox-light-core pipeline:: --lib
          cargo test --locked -p localvox-light-core windowing:: --lib
          rustfmt --edition 2021 --check crates/localvox-light-core/src/incremental.rs
          cargo test --locked -p localvox-light-core incremental:: --lib
          cargo test --locked -p localvox-light-asr --features asr-fixtures --test incremental_fixture
          $env:LOCALVOX_TEST_ASR_WORKER = (Resolve-Path target/debug/localvox-process.exe).Path
          cargo test --locked -p localvox-light --lib autocook::prefix_tests -- --ignored --nocapture
      - name: Real worker cancellation and standalone CLI ownership (local HTTP, no models/devices)
        run: cargo test --locked -p localvox-light --lib autocook::cancellation_tests -- --ignored --nocapture
      - name: Background indexes and search (local HTTP, no models/devices)
        run: |
          rustfmt --edition 2021 --check crates/localvox-light/src/autocook/indexing_tests.rs
          rustfmt --edition 2021 --check crates/localvox-light-search/src/semantic.rs
          cargo test --locked -p localvox-light --lib autocook::indexing_tests:: -- --ignored --skip indexing_fixture --test-threads=1 --nocapture
      - name: Both clients against one actual temporary API/archive
        run: cargo test --locked -p localvox-light-api --lib -- --ignored --exact http::tests::cross_clients::shared_workspace --nocapture
      - name: Real media backend (generated PCM, null audio output)
        run: cargo test --locked -p localvox-light-terminal --test media_playback -- --ignored --nocapture
      - name: Install FLAC test dependency on the CI runner
        run: choco install ffmpeg --yes --no-progress
      - name: Real archive HTTP media and sample-accurate FLAC
        run: |
          cargo test --locked -p localvox-light-core --lib chunks::codec::tests::real_ -- --ignored --nocapture
          cargo test --locked -p localvox-light-core --lib chunks::planning::tests::real_ -- --ignored --nocapture
          cargo test --locked -p localvox-light-core --lib incremental::audio::tests::real_ -- --ignored --nocapture
          cargo test --locked -p localvox-light-api media_http_range_plays --lib -- --ignored --nocapture
          cargo test --locked -p localvox-light-api flac_range_is_sample_accurate --lib -- --ignored --nocapture
          cargo test --locked -p localvox-light-api http::tests::partial::real_ --lib -- --ignored --nocapture --test-threads=1
      - name: Specification checks
        run: |
          npx --yes @fission-ai/openspec@1.13.2 validate --specs --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate add-technical-journal-workspace --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate add-incremental-recording-transcription --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate control-postprocessing-and-terminal-player --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate refactor-terminal-command-dispatch --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate fix-browser-artifact-refresh --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate fix-workspace-status-polling --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate format-api-rust-sources --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate fix-browser-player-lifecycle --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate fix-queue-read-failures --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate resume-failed-processing --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate explain-automatic-retry-state --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate commit-queue-execution-transitions --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate persist-worker-outcomes --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate benchmark-processing-batch --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate profile-summary-grounding-cost --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate profile-ner-inference-cost --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate skip-irrelevant-role-windows --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate verify-current-release-pipeline --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate recheck-native-cleanup-after-word-guard --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate extract-headless-processing-coordinator --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate verify-background-indexing --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate fix-empty-semantic-index-failure --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate refine-workspace-controls-and-settings --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate profile-text-postprocessing-cost --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate experiment-guarded-sparse-text-edits --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate evaluate-local-cleanup-quality --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate screen-portable-cleanup-models --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate fix-text-correction-retention --type change --strict --no-interactive
          npx --yes @fission-ai/openspec@1.13.2 validate fix-unsupported-russian-word-corrections --type change --strict --no-interactive
          python scripts/check-openspec.py
          git diff --check
      - name: Upload browser diffs, traces and terminal snapshot proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-test-evidence-windows
          if-no-files-found: ignore
          path: |
            ui/test-results/
            ui/playwright-report/
            crates/localvox-light-terminal/src/snapshots/*.snap.new
            crates/localvox-light-terminal/src/render/snapshots/*.snap.new
