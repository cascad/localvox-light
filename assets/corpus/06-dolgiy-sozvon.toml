name = "Длинный созвон: проверка не должна клеймить честный протокол"
lang = "ru"

# ЗАЧЕМ ЭТА ЗАПИСЬ ДЛИННАЯ.
#
# Ревью WP-C16 поймало первую версию проверки обоснованности так: на НАСТОЯЩЕМ
# протоколе она объявила выдумками 26 слов, и все 26 были законными. На коротком
# тексте этого не видно — четыре слова источника прощают всё. Малый корпус
# маскирует и ложные тревоги, и пропуски.
#
# Раньше это охранял тест на живых артефактах из корня репозитория
# (`transcript_uat.txt`). Их пришлось убрать: это была расшифровка НАСТОЯЩЕГО
# разговора владельца, и ей не место в репозитории. Тест без своих данных молча
# пропускался — то есть врал, что покрытие есть.
#
# Здесь запись СИНТЕТИЧЕСКАЯ, но правдоподобная: обрывы, склеенные слова, «э-э»,
# числа словами, англицизмы, искажённые ASR («капасити», «дэдлайн», «эйчар»).
# Ровно то, на чём проверка и ошибалась.
transcript = """
Так, всё, начали. Э-э, слышно меня? Ага, отлично. Давайте по порядку, у нас, короче, три темы.
Первая — почему мы не влезаем в квартал. Вторая — что делаем с очередью. И третья, э-э, найм.
Значит по первой. Мы взяли на квартал сорок задач, а закрыли двадцать восемь. Причём не потому
что мы медленные, а потому что капасити посчитали по головам, а не по факту. Двое были в отпуске,
один на онбординге, и это, ну, минус полторы недели чистого времени примерно.
Погоди, а мы это где-то фиксировали? Нет. Вот в этом и проблема. Мы это каждый раз обсуждаем на
ретро и каждый раз забываем. Ага. Ну то есть, э-э, надо просто вести учёт, да?
Ну да, надо. Я предлагаю следующее: капасити считаем в человеко-днях, а не в людях. И вычитаем
отпуска заранее, до планирования, а не постфактум. Согласен. Тогда цифра будет честная.
Так, по второй теме. Очередь. У нас в бэклоге лежит, э-э, около двухсот тикетов, из них половина
старше года. Это не бэклог, это кладбище. Их никто не разгребёт никогда.
Предлагаю: всё, что старше года и ни разу не всплывало — закрываем. Не удаляем, а закрываем с
пометкой. Если кому-то нужно, он придёт и переоткроет. Ну, логично. Кто это сделает?
Давай я. К пятнице пройдусь и закрою. Только надо предупредить поддержку, а то они, э-э, ссылаются
на старые тикеты. Хорошо, я напишу им в канал.
И третья тема, найм. Эйчар прислала пять резюме, из них два вообще мимо, там джуны с опытом
полгода. Нам нужен человек, который сам себе поставит задачу. Согласен, сеньор или крепкий мидл.
Собеседования когда? Давай на следующей неделе, вторник и четверг. По часу на человека, не больше,
иначе мы весь день просидим. Ага. И, э-э, техническую часть даём заранее, чтобы не тратить время
на созвоне. Разумно.
Так, что ещё. А, дэдлайн по релизу. Мы обещали к концу месяца, но я считаю, что мы не успеем.
Реалистично — плюс две недели. Лучше сказать сейчас, чем за день до срока. Согласен полностью.
Тогда так и говорим: релиз переносим на две недели, причина — недооценили капасити, а не потому
что что-то сломалось. Да, и это надо честно написать, а не размазывать.
Ладно, подытожим. Капасити считаем в человеко-днях. Бэклог старше года — закрываем к пятнице.
Собеседования во вторник и четверг. Релиз плюс две недели. Всё? Всё. Спасибо, разошлись.
"""

# ГЛАВНЫЙ СЛУЧАЙ: длинный честный протокол. Он пересказывает СВОИМИ словами,
# канонизирует искажённые ASR англицизмы («капасити» → capacity), переводит числа
# из слов в цифры — и НИ ОДНОГО факта не выдумывает.
#
# Если проверка обвинит его хоть в чём-то — она снова клеймит честный текст, и
# ровно так это ловилось на живом протоколе.
[[case]]
name = "длинный честный протокол — ни одного обвинения"
verdict = "clean"
answer = """
## О чём запись
Созвон команды: разбирали, почему не уложились в квартал, что делать с бэклогом и как вести найм.

## Главное
Взяли на квартал 40 задач, закрыли 28. Причина не в скорости, а в том, что capacity считали по
головам, а не по факту: двое были в отпуске, один на онбординге — примерно минус полторы недели
чистого времени.

В бэклоге около 200 тикетов, половина старше года. Решили закрывать такие с пометкой, не удаляя:
если понадобится, их переоткроют.

## Решения
*   Capacity считать в человеко-днях, а не в людях, и вычитать отпуска заранее, до планирования.
*   Тикеты старше года закрыть с пометкой; поддержку предупредить в канале.
*   Релиз перенести на две недели: причина — недооценили capacity, а не поломка.

## Задачи
*   Пройтись по бэклогу и закрыть старые тикеты — к пятнице.
*   Написать поддержке в канал про закрытие старых тикетов.
*   Провести собеседования во вторник и четверг, по часу на человека; техническую часть выдать
    заранее.
"""

# Выдумка в длинном тексте: числа, которых в записи не было. Их проверка обязана
# поймать даже среди множества законных чисел (40, 28, 200, две недели) — иначе
# длинный текст становится ширмой для вранья.
[[case]]
name = "выдуманные числа тонут в длинном тексте — но обязаны всплыть"
verdict = "flagged"
numbers = ["15", "350"]
answer = """
## Главное
Взяли 40 задач, закрыли 28. Бюджет найма — 350 тысяч рублей на человека.

## Задачи
*   Закрыть 15 старых тикетов к пятнице.
"""

# Выдуманное имя в длинном тексте. В записи НЕТ НИ ОДНОГО имени — говорят «я»,
# «давай я», «эйчар». Протокол, который называет исполнителя по имени, сочинил его.
[[case]]
name = "выдуманный исполнитель в длинном протоколе"
verdict = "flagged"
names = ["кирилл"]
needs_ner = true
answer = """
## Задачи
*   Кирилл пройдётся по бэклогу и закроет старые тикеты к пятнице.
"""
