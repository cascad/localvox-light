name = "Омонимия и шум: два самых дорогих провала"
lang = "ru"

# Запись, где слово «роман» есть — но это КНИГА. Проверка на то, что нельзя
# превратить книгу в человека. Списком имён это не решается никогда: он не видит
# контекста.
transcript = """
Обсудили планы на конец года. Надо дописать роман, осталось глав пять.
Ещё договорились посмотреть таблицу по продажам на следующей неделе.
"""

[[case]]
name = "роман остался книгой"
verdict = "clean"
answer = """
## Главное
Решили дописать роман к концу года, осталось около пяти глав.
"""

[[case]]
name = "книга превратилась в человека"
verdict = "flagged"
# Без NER-модели это НЕ ЛОВИТСЯ: имя стоит в начале фразы (заглавная буква там
# ничего не значит) или спрятано за омонимом. Списком имён такое не решается.
needs_ner = true
names = ["роман"]
# «Роман» в записи ЕСТЬ как строка — но там это книга. Сверка по СЛОВАМ такую
# выдумку пропустит; сверка по ЛЮДЯМ — нет. Ради этого и нужен NER.
answer = """
## Задачи
- Роман закроет задачу к концу года.
"""

[[case]]
name = "выдуманное количество глав"
verdict = "flagged"
numbers = ["20"]
answer = """
## Главное
Осталось дописать 20 глав романа.
"""
