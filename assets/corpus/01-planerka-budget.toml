name = "Планёрка: бюджет и сроки"
lang = "ru"

# Насыщенная встреча: имена, числа словами и цифрами, сроки, решения.
# Ровно тот материал, на котором проверка обязана и работать, и молчать.
transcript = """
Так, давайте начнём. Мы с Иваном вчера свели бюджет на следующий квартал.
Получается около двухсот тысяч рублей, из них половина уходит на инфраструктуру.
Мария, ты успеешь закрыть свою часть до пятницы?
Да, у меня осталось примерно тридцать задач, большая часть мелкие.
Хорошо. Тогда договорились: релиз переносим на следующую неделю, потому что тесты
ещё не прошли. Иван готовит смету, Мария закрывает бэклог.
Ещё нужно обновить документацию по онбордингу до демо.
"""

[[case]]
name = "честный протокол"
verdict = "clean"
answer = """
## О чём запись
Планёрка: свели бюджет на следующий квартал, распределили задачи, перенесли релиз.

## Главное
Бюджет на квартал — порядка 200 000 рублей, половина на инфраструктуру.
Релиз переносится на следующую неделю: тесты ещё не прошли.

## Задачи
- Иван — подготовить смету.
- Мария — закрыть бэклог (около 30 задач) до пятницы.
- Обновить документацию по онбордингу до демо.
"""

[[case]]
name = "число словами против цифр — не выдумка"
