name = "Лекция про «Обломова»: у лекции не бывает поручений"
lang = "ru"

# Настоящая лекция из архива. Много НАСТОЯЩИХ имён (Гончаров, Добролюбов, Базаров,
# Рахметов) — на них проверяется ПОЛНОТА: их нельзя объявить выдумкой.
# И много нарицательных «людей» (помещик, крестьяне) — на них проверяется ТОЧНОСТЬ.
transcript = """
Илья Ильич Обломов — человек светский, но лежащий на диване. Обломовка — это место
вечного лета, отделённое от внешнего мира: там нет власти, нет соседей, нет
вторжений, царит всеобщее довольство и покой. По воскресеньям в Обломовке пекут
исполинский пирог. Первые два дня его едят господа, потом он поступает в девичью,
а самый чёрствый кусочек без начинки достаётся последнему конюху Антипке и
крепостным крестьянам. Старик Обломов — помещик, и крестьяне живут при нём.
Добролюбов заклеймил Обломова, назвав его лишним человеком и примером
деградирующего дворянства. Штольц пытается его расшевелить, Ольга тоже.
Через три года после романа будет написан образ Базарова у Тургенева, через четыре
года — образ Рахметова. Гончаров писал не про ситуацию в России середины
девятнадцатого века, а большой русский роман о душе.
"""

[[case]]
name = "честный разбор: настоящие имена не выдумка"
verdict = "clean"
# Гончаров, Добролюбов, Базаров, Рахметов, Штольц — все звучали. Обвинять нельзя.
answer = """
## О чём запись
Разбор романа Гончарова «Обломов»: образ Обломовки, трактовка героя и критика
Добролюбова.

## Главное
Обломовка — утопическое место вечного лета, отделённое от мира. Добролюбов
заклеймил Обломова как лишнего человека. Штольц пытается его расшевелить.

## Детали и цифры
Через три года после романа появится Базаров у Тургенева, через четыре — Рахметов.
Пирог: два дня едят господа, чёрствый кусок достаётся конюху Антипке.
"""

[[case]]
name = "нарицательные «люди» — не выдуманные люди"
verdict = "clean"
# «помещик», «крестьяне» — категории, а не имена. Модель их метит как людей;
# обвинять за них нельзя: они в записи есть.
answer = """
## Главное
Старик Обломов — помещик, при нём живут крепостные крестьяне.
"""

[[case]]
name = "выдуманный писатель"
verdict = "flagged"
# Без NER-модели это НЕ ЛОВИТСЯ: имя стоит в начале фразы (заглавная буква там
# ничего не значит) или спрятано за омонимом. Списком имён такое не решается.
needs_ner = true
names = ["достоевский"]
answer = """
## Главное
Достоевский заклеймил Обломова как лишнего человека.
"""

[[case]]
name = "переставленный срок"
verdict = "flagged"
numbers = ["7"]
answer = """
## Детали и цифры
Через 7 лет после романа появится образ Базарова.
"""
