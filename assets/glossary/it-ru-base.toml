# Глоссарий IT-терминов — базовый seed (2026-07-11)
# Источник: реальные искажения ASR из UAT-встречи (docs: transcript_uat_processed.md §1)
# + частые термины. Дополняется по ходу (майнинг архива, per-slot глоссарии).
#
# canonical          — каноническое написание в processed-тексте
# variants           — однозначные искажения: можно заменять детерминированно
# ambiguous_variants — совпадают с обычной русской речью: автозамена ЗАПРЕЩЕНА,
#                      только пометка + подсказка LLM-арбитру (контекст решает)

