[package]
name = "localvox-light"
version.workspace = true
edition.workspace = true
description = "Standalone local transcription: audio capture → VAD → Vosk ASR → transcript. No server needed."
default-run = "localvox-light"

[[bin]]
name = "localvox-light"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:localvox-light-tui"]

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
tray-item = "0.10"

# `nice` for the cook child: background work must yield to the recording (the Windows side of
# this is BELOW_NORMAL_PRIORITY_CLASS, set through creation_flags).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dependencies]
localvox-light-api = { path = "../localvox-light-api" }
localvox-light-core.workspace = true
localvox-light-ingest = { path = "../localvox-light-ingest" }
localvox-light-search = { path = "../localvox-light-search" }
localvox-light-tui = { workspace = true, optional = true }
localvox-light-voice = { path = "../localvox-light-voice" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
crossbeam-channel.workspace = true
dotenvy.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
