[package]
name = "localvox-light"
version.workspace = true
edition.workspace = true
description = "Standalone local transcription: audio capture → VAD → Vosk ASR → transcript. No server needed."
default-run = "localvox-light"

[[bin]]
name = "localvox-light"
path = "src/main.rs"

[features]
default = ["tui"]
# Compatibility feature: launches the independent sibling HTTP client.
tui = []

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
tray-item = "0.10"

[dependencies]
localvox-light-api = { path = "../localvox-light-api" }
localvox-light-core.workspace = true
localvox-light-process.workspace = true
localvox-light-ingest = { path = "../localvox-light-ingest" }
localvox-light-voice = { path = "../localvox-light-voice" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
crossbeam-channel.workspace = true
dotenvy.workspace = true
serde_json.workspace = true
serde.workspace = true
ureq.workspace = true
url.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
localvox-light-client = { path = "../localvox-light-client" }
tempfile.workspace = true
portable-pty = "0.9"
tiny_http.workspace = true
