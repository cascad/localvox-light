# Числительные словами → значение. Нужны проверке обоснованности: модель пишет
# «больше ста пятидесяти», и это то же число 150, которое обязано быть в записи.
#
# Формы перечислены явно, а не выведены стеммером: «пять» и «пятьдесят» начинаются
# одинаково, и любая обрезка основы склеивает 5 с 50. Список конечен — угадывать нечего.
#
# Дополнить своими формами можно файлом в LOCALVOX_LEXICON_DIR.

# Слова, которые выглядят единицей, но означают артикль: «одна из задач»,
# «ещё одну». В составе числа («двадцать один», «одна тысяча») работают как число.
# Это ЯЗЫКОВОЙ ФАКТ, и потому он здесь, а не в коде разбора: языков много.
articles = ["один", "одна", "одно", "одну", "одного", "одной"]

# Связка ВНУТРИ числа. В русском «и» между числами их и разделяет, но правило
# разрядов и без того разводит «сорок два и восемь» на 42 и 8, поэтому связку
# можно не считать разрывом — и «сто и пятьдесят» соберётся в 150.
connectors = ["и"]

