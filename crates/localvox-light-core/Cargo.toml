[package]
name = "localvox-light-core"
version.workspace = true
edition.workspace = true
description = "Local audio capture → VAD → Vosk ASR → transcript.jsonl (library)."

[lib]
name = "localvox_light_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
localvox-light-process.workspace = true
chrono.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
cpal.workspace = true
hound.workspace = true
memmap2 = "0.9"
serde.workspace = true
serde_json.workspace = true
url.workspace = true
sha2 = "0.10"
same-file = "1"
kodama = "=0.3.0"
tempfile.workspace = true
# Лексикон (имена, аббревиатуры, числительные) — данные в TOML, не код.
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
vosk.workspace = true
webrtc-vad.workspace = true
rubato.workspace = true
# Язык записи (lang.rs): определение по тексту + коды ISO-639.
whatlang.workspace = true
isolang.workspace = true

# Опциональные зависимости: ONNX-движки (GigaAM v3 и т.п.).
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
half = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
realfft = { workspace = true, optional = true }

[features]
default = []
# Включает `asr::onnx::*`: trait OnnxAdapter, OnnxEngine + адаптеры (GigaAM v3 и др.).
# Тащит `ort` (onnxruntime, CPU-провайдер по умолчанию), `ndarray`, `realfft`.
onnx = ["dep:ndarray", "dep:ort", "dep:realfft", "dep:tokenizers", "dep:half", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:rayon"]
# Explicit fixture worker builds only; never selected by an ordinary model lookup.
asr-fixtures = ["onnx"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi.workspace = true
windows = { version = "0.62", features = ["Win32_System_Com"] }
winreg = "0.52"

[dev-dependencies]
dotenvy.workspace = true
tempfile.workspace = true
