[package]
name = "localvox-light-bench"
version.workspace = true
edition.workspace = true
description = "Measuring ASR quality: WER/CER on reference datasets, sweeps over window parameters, assembling long-form sets."

[[bin]]
name = "localvox-bench"
path = "src/main.rs"

[dependencies]
localvox-light = { path = "../localvox-light", default-features = false }
localvox-light-core = { workspace = true, features = ["onnx"] }
localvox-light-llm.workspace = true
localvox-light-process.workspace = true
anyhow.workspace = true
# Зонд probe_ner: читает сигнатуру ONNX-графа NER-модели напрямую.
ort.workspace = true
clap.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
webrtc-vad.workspace = true
ureq.workspace = true
toml.workspace = true
sha2 = "0.10"
ctrlc.workspace = true
chrono = "0.4"
tiny_http.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true
