# Слоты — голосовые имена назначений заметок («запиши в слот идеи»).
# Скопируйте в slots.toml и поправьте пути. Как это работает — docs/integrations.md.
#
# Слот = имя + алиасы + интеграция (type):
#   type = "files" — файл или папка на диске (Obsidian vault = просто файлы)
#   type = "mcp"   — любой MCP-сервер (Obsidian-MCP, Notion, …)
# Плейсхолдеры шаблона: {{text}} {{date}} {{time}}. Кириллические имена — в кавычках.

# Файл: каждая заметка — строка в конце (append)
[slots."идеи"]
type = "files"                      # тип интеграции; "files" — по умолчанию, можно опускать
aliases = ["идея", "в идеи"]
description = "продуктовые и технические идеи, гипотезы, «а что если»"  # подсказка LLM-роутингу (F5, кнопка 🧭)
path = "D:/vault/Входящие/Идеи.md"
template = "- [ ] {{date}} — {{text}}"
default = true                      # сюда падает «запиши» без адреса

# Папка: каждая заметка — отдельный md-файл (инбокс в стиле Zettelkasten)
[slots."входящие"]
aliases = ["во входящие"]
path = "D:/vault/Входящие"
template = "{{text}}"

# Файл с другой логикой на том же vault
[slots."ретро"]
aliases = ["ретро песня", "в ретро"]
path = "D:/vault/Музыка/Ретро.md"
template = "- {{text}}"

# ── Кастомные голосовые активаторы (опционально) ──
# Без этой секции работает один активатор из LOCALVOX_LIGHT_VOICE_TRIGGER («запиши»).
# Активатор может жёстко привязывать слот: адрес в речи тогда не нужен.
# [commands."запиши"]                # обычная команда: слот из фразы («в идеи…»)
# [commands."запомни"]               # «запомни купить кофе» → сразу в слот идеи
# slot = "идеи"
# [commands."отметь мысль"]          # многословный активатор
# slot = "входящие"

# MCP: заметка уходит вызовом инструмента MCP-сервера (пример — Obsidian-MCP)
# [slots."обсидиан"]
# type = "mcp"
# command = "npx"
# args = ["-y", "obsidian-mcp-server"]     # команда запуска сервера
# tool = "append_content"                   # имя инструмента у сервера
# text_arg = "content"                      # аргумент, куда кладётся текст
# [slots."обсидиан".static_args]            # постоянные аргументы инструмента
# filename = "Входящие/Идеи.md"
